name: Phase 3

on:
  workflow_dispatch:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate robustness artifacts
        run: |
          python - <<'PY'
          import pathlib
          expected = [
              'src/engine',
              'tests',
              'docs/security.md',
          ]
          for path in expected:
              assert pathlib.Path(path).exists(), f'Missing: {path}'
          print('Phase 3 structure present.')
          PY
