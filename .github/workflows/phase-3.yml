name: Phase 3

on:
  workflow_dispatch:
  workflow_call:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate robustness artifacts
        run: |
          python - <<'PY'
          import pathlib
          expected = [
              'src/engine',
              'tests',
              'docs/security.md',
          ]
          for path in expected:
              assert pathlib.Path(path).exists(), f'Missing: {path}'
          print('Phase 3 structure present.')
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt
      - name: Run robust execution tests
        run: pytest -q tests/test_robust_execution.py
