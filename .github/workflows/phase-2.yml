name: Phase 2

on:
  workflow_dispatch:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate desktop structure
        run: |
          python - <<'PY'
          import pathlib
          expected = [
              'src/desktop',
              'docs/developer-guide.md',
          ]
          for path in expected:
              assert pathlib.Path(path).exists(), f'Missing: {path}'
          print('Phase 2 structure present.')
          PY
