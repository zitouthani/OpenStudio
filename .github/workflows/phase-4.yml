name: Phase 4

on:
  workflow_dispatch:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate connectors layout
        run: |
          python - <<'PY'
          import pathlib
          expected = [
              'src/components',
              'docs/talend-importer.md',
          ]
          for path in expected:
              assert pathlib.Path(path).exists(), f'Missing: {path}'
          print('Phase 4 structure present.')
          PY
