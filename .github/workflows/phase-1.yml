name: Phase 1

on:
  workflow_dispatch:
  workflow_call:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate package layout
        run: |
          python - <<'PY'
          import pathlib
          expected = [
              'src/job_model',
              'src/engine',
              'src/data_runtime',
              'src/component_sdk',
              'src/components',
              'tests',
          ]
          for path in expected:
              assert pathlib.Path(path).exists(), f'Missing: {path}'
          print('Phase 1 structure present.')
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt
      - name: Run end-to-end CSV pipeline test
        run: pytest -q tests/test_core_pipeline.py
