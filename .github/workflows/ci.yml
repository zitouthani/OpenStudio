name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Run tests
        run: pytest -q

      - name: Audit Python dependencies
        run: pip-audit -r requirements/dev.txt

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Build package
        run: python -m build

  desktop-smoke:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and GUI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt
          python -m pip install -e ".[gui]"

      - name: Run desktop smoke test
        run: pytest -q tests/test_desktop_window.py
